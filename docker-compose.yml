services:
  app:
    build: .
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - jobs:/app/web/backend/jobs
    environment:
      - BATCH_SIZE=${BATCH_SIZE:-16}
      # Phase 14 / Option A — propagated by PersonalPortfolio/.env.shared
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-local-dev}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-1.0}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-local-dev}
      - PYTHONUNBUFFERED=1

volumes:
  jobs:
